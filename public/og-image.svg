<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="300" fill="#00d9ff" opacity="0.03"/>
  <circle cx="1100" cy="530" r="400" fill="#00ff88" opacity="0.03"/>
  
  <!-- Card background -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0f0f23" opacity="0.8"/>
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  
  <!-- Name -->
  <text x="600" y="220" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Nikhil Singh
  </text>
  
  <!-- Title -->
  <text x="600" y="290" font-family="system-ui, sans-serif" font-size="32" fill="url(#accent)" text-anchor="middle" font-weight="600">
    Senior Full Stack Developer
  </text>
  
  <!-- Divider -->
  <line x1="200" y1="330" x2="1000" y2="330" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  
  <!-- Skills/Tags -->
  <text x="600" y="380" font-family="system-ui, sans-serif" font-size="22" fill="#a0a0b0" text-anchor="middle">
    Next.js • React • Node.js • TypeScript • AWS • NDC APIs • GenAI
  </text>
  
  <!-- CTA -->
  <text x="600" y="480" font-family="system-ui, sans-serif" font-size="26" fill="white" text-anchor="middle" opacity="0.7">
    nik hilsingh-eight.vercel.app
  </text>
  
  <!-- Bottom accent -->
  <rect x="80" y="530" width="200" height="4" rx="2" fill="url(#accent)"/>
</svg>