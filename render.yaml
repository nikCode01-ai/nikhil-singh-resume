services:
  - type: web
    name: nik-be
    runtime: node
    plan: free
    buildCommand: rm -rf node_modules package-lock.json .cache dist .strapi && npm install && rm -rf node_modules/@codemirror/state node_modules/@codemirror/view && npm install @codemirror/state@6.7.0 @codemirror/view@6.43.5 --save-exact --force && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 1337
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: '0'
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        value: postgresql://postgres:T%40_p%2Fp6hSiS2bg7@db.ujqsoynvhcxilgnyvrzb.supabase.co:5432/postgres
      - key: DATABASE_SSL
        value: 'true'
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
